name: Deploy Poller to Fly.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Poller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh
      - name: Add flyctl to PATH
        run: echo "$HOME/.fly/bin" >> $GITHUB_PATH
      - run: fly deploy --config fly.poller.toml --app seatstalker-poller --ha=false --no-config-merge
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_POLLER }}