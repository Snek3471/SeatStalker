name: Deploy Poller to Fly.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Poller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: fly deploy --config fly.poller.toml --app seatstalker-poller --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_POLLER }}